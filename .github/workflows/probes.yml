name: probes

on:
  push:
    branches: [main, 'orch/**']
    paths: ['probes/**', '.github/workflows/probes.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p-r0:
    # Runner facts: admin rights, OS and image versions. Control: a non-admin identity is not admin.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: P-R0-linux, os: ubuntu-latest, shell: bash }
          - { id: P-R0-macos, os: macos-latest, shell: bash }
          - { id: P-R0-windows, os: windows-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1 (lightweight tag, resolves directly to the commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Self-test the result writer
        if: matrix.shell == 'bash'
        shell: bash
        run: bash probes/lib/result.sh --self-test
      - name: Probe (bash)
        if: matrix.shell == 'bash'
        shell: bash
        run: ./probes/runner-facts/facts.sh
      - name: Probe (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./probes/runner-facts/facts.ps1
      # actions/upload-artifact v7.0.2 (lightweight tag, resolves directly to the commit)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: probe-${{ matrix.id }}
          path: probe-results/${{ matrix.id }}.json
          if-no-files-found: error
