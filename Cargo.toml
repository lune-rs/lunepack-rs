[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["probes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lune-rs/lunepack-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
lunepack-core = { path = "crates/lunepack-core" }
lunepack-testkit = { path = "crates/lunepack-testkit" }
lunepack-crypto = { path = "crates/lunepack-crypto" }
lunepack-codec-lzma = { path = "crates/lunepack-codec-lzma" }
lunepack-fs = { path = "crates/lunepack-fs" }
lunepack-http = { path = "crates/lunepack-http" }
lunepack-os-windows = { path = "crates/lunepack-os-windows" }
lunepack-os-macos = { path = "crates/lunepack-os-macos" }
lunepack-os-linux = { path = "crates/lunepack-os-linux" }
lunepack = { path = "crates/lunepack" }
lunepack-runtime = { path = "crates/lunepack-runtime" }
lunepack-cli = { path = "crates/lunepack-cli" }

# Core's pure external crates (M2-D1); the boundary check allowlists exactly these for lunepack-core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
semver = "1"
unicode-normalization = "0.1"
thiserror = "2"

# Crypto adapter (M2 step 7): pure Rust, no C. rand_core/getrandom are for tests only (crate dev-dependencies).
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
