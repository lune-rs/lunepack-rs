[package]
name = "lunepack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lunepack-core.workspace = true
# The default adapters; the facade is the composition root for embedding apps.
lunepack-codec-lzma.workspace = true
lunepack-crypto.workspace = true
lunepack-fs.workspace = true
lunepack-http.workspace = true
thiserror.workspace = true
# The cache's part sidecars (strict JSON on read through the core) and feed URL resolution.
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true
# The default-adapter build test uses a real temporary directory.
tempfile = { workspace = true }
# The plumbing and scenario suites run under five executors (M4 step 10): the built-in
# `block_on`, futures' `block_on`, tokio current-thread and multi-thread, and smol. Tests only;
# the facade's own task plumbing is std-only (M4-D3).
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }
smol = "2"
