[package]
name = "lunepack-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lunepack-core.workspace = true
sha2 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "zeroize"] }
getrandom = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true
# Test keys are generated at test time; none is committed.
ed25519-dalek = { workspace = true, features = ["rand_core", "signature"] }
getrandom = { workspace = true, features = ["sys_rng"] }
tempfile = { workspace = true }
base64 = { workspace = true }

# Own main: the command-signer and env-signer tests re-run this binary as a helper process, and the
# helper's stdout must hold the signature and nothing else (the libtest harness prints to stdout).
[[test]]
name = "signer"
harness = false
